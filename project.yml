name: TiCi
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.teleprompter
    APP_STORE_ID: "6835020203"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  TiCi:
    type: application
    platform: iOS
    sources: [TiCi, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: TiCi AppStore
    info:
      path: TiCi/Info.plist
      properties:
        CFBundleDisplayName: 提词器
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: 用于在手机上拍摄提词视频。
        NSMicrophoneUsageDescription: 用于录制视频声音和设备端语音跟随。
        NSSpeechRecognitionUsageDescription: 语音跟随只在手机上识别，不上传音频或稿件。
        NSPhotoLibraryAddUsageDescription: 用于将你录制的视频添加到相册。
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        TiCiProProductID: $(APP_ID).pro
        APP_STORE_ID: $(APP_STORE_ID)
  TiCiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TiCiTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
  TiCiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TiCiUITests]
    dependencies:
      - target: TiCi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TiCi
schemes:
  TiCi:
    build:
      targets:
        TiCi: all
        TiCiTests: [test]
    test:
      config: Debug
      targets: [TiCiTests]
  TiCiUI:
    build:
      targets:
        TiCi: all
        TiCiUITests: [test]
    test:
      config: Debug
      targets: [TiCiUITests]
